name: payment-module

services:
  app:
    build:
      context: .
    environment:
      APP_ENV: local
      PORT: "8002"
      DATABASE_URL: postgresql+psycopg://payment_module:payment_module@db:5432/payment_module
      DATABASE_TIMEZONE: Asia/Manila
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_module
      POSTGRES_USER: payment_module
      POSTGRES_PASSWORD: payment_module
      TZ: Asia/Manila
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - payment-module-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_module -d payment_module"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  payment-module-postgres:
